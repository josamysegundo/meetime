<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel de Metas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Painel de Metas</div>
    <nav class="tabs">
      <a href="#" class="tab active">Metas</a>
      <a href="#" class="tab" aria-disabled="true">Atividades</a>
      <a href="#" class="tab" aria-disabled="true">Cadências</a>
    </nav>
  </header>

  <main class="page">
    <section class="filters" aria-label="Filtros">
      <label>Período
        <select id="f-period">
          <option value="today">Hoje</option>
          <option value="week">Esta semana</option>
          <option value="month" selected>Este mês</option>
        </select>
      </label>
      <label>Equipe
        <select id="f-team"></select>
      </label>
      <label>Vendedor
        <select id="f-user"></select>
      </label>
      <fieldset class="cadence-filter">
        <legend>Tipo de cadência</legend>
        <div id="f-cadence"></div>
      </fieldset>
      <button id="btn-goals" class="btn">Editar metas</button>
    </section>

    <p class="sample-note">Dados de exemplo gerados localmente. Troque a função <code>loadData()</code> em <code>app.js</code> pela sua fonte real.</p>

    <section id="kpis" class="kpis" aria-label="Resumo das metas"></section>

    <section class="card">
      <div class="card-head">
        <h2>Evolução diária</h2>
        <select id="f-metric"></select>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Metas por vendedor</h2></div>
      <div class="table-wrap">
        <table id="ranking">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="goals-dialog">
    <form method="dialog" id="goals-form">
      <h2>Metas mensais por vendedor</h2>
      <div id="goals-fields"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost">Cancelar</button>
        <button value="save" class="btn">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
